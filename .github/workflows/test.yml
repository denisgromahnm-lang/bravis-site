name: Validate BRAVIS website
on:
  push:
    paths:
      - 'site/**'
      - 'scripts/verify_site.py'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate static site without paid API or npm
        run: |
          cd site
          python3 src/build.py
          python3 scripts/render_menu_gallery.py
          python3 verify.py
          python3 scripts/quality_gate.py --production-guard
      - name: Verify menu and brand integrity
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('site')
          c=json.loads((base/'site.config.json').read_text(encoding='utf8'))
          assert c['public'] is False and c['smartReserveId']=='5b1e469e-871a-4eb8-bd2a-787ec2d011c3'
          assert c['yandexMetrikaId']=='113768615' and not c['ga4Id']
          assert c['restaurantName']=='BRAVIS'
          assert c['operatorLegalName']=='Общество с ограниченной ответственностью «Инвойс»'
          assert c['operatorInn']=='7723860392' and c['operatorOgrn']=='1137746040981'
          assert c['operatorContactEmail']=='bravis.msk@mail.ru'
          contacts_html=(base/'dist/contacts/index.html').read_text(encoding='utf8')
          homepage_html=(base/'dist/index.html').read_text(encoding='utf8')
          assert 'mailto:bravis.msk@mail.ru' in contacts_html
          assert 'mailto:bravis.msk@mail.ru' in homepage_html
          assert '"email": "bravis.msk@mail.ru"' in homepage_html
          assert 'in.vois@mail.ru' not in contacts_html and 'in.vois@mail.ru' not in homepage_html
          assert c['operatorPostalAddress']=='115446, г. Москва, ул. Академика Миллионщикова, д. 35, к. 4'
          assert c['legalPolicyApproved'] is False and c['productionReleaseApproved'] is False
          policy=(base/'dist/privacy/index.html').read_text(encoding='utf8')
          for item in ('Общество с ограниченной ответственностью «Инвойс»','7723860392','1137746040981','bravis.msk@mail.ru',
                       'ул. Академика Миллионщикова','Проект документа','Яндекс Метрика','Настройки cookie','Яндекс СмартРезерв'):
              assert item in policy, f'Missing privacy disclosure: {item}'
          assert '40702810500000320283' not in policy,'Bank account should not be published'
          assert 'class="policy-warning"' in policy,'Draft policy must be visibly unapproved'
          assert c['yandexMapsUrl']=='https://yandex.ru/maps/org/bravis/120928769508/'
          assert c['twoGisUrl']=='https://2gis.ru/moscow/firm/70000001098229175'
          assert c['yandexEdaRestaurantUrl']=='https://eda.yandex.ru/r/bravis?placeSlug=bravis'
          loona='https://app.loona.ai/4992/create/register?source=qr&tag=none'
          assert c['loonaJoinUrl']==loona, 'Loona must use the owner-provided URL verbatim'
          index=(base/'dist/index.html').read_text(encoding='utf8')
          assert 'id="delivery"' in index and 'id="loyalty"' in index
          assert 'href="https://eda.yandex.ru/r/bravis?placeSlug=bravis"' in index
          assert 'data-track="delivery_click"' in index
          from html import unescape
          assert loona in unescape(index), 'Loona registration URL missing or rewritten'
          assert 'data-track="loona_signup_click"' in index, 'Loona signup metric missing'
          assert 'loona-register.svg' in index, 'Self-hosted QR missing in loyalty block'
          assert 'Онлайн-регистрация скоро появится' not in index
          qr=(base/'dist/assets/loona-register.svg').read_text(encoding='utf8')
          assert loona in unescape(qr), 'QR must describe owner-provided Loona registration URL'
          assert 'viewBox="0 0 41 41"' in qr and qr.count('h-')>=250, 'QR SVG missing matrix geometry'
          assert 'приветственные бонусы сразу после регистрации' in index
          assert 'href="/#delivery"' in index and 'href="/#loyalty"' in index
          twogis=c['twoGisUrl']
          contacts=(base/'dist/contacts/index.html').read_text(encoding='utf8')
          assert contacts.count(twogis)>=2, '2GIS link missing in contacts panel and map card'
          assert 'Открыть в 2ГИС' in contacts
          for page_path in ('index.html','contacts/index.html'):
              html=(base/'dist'/page_path).read_text(encoding='utf8')
              assert twogis in html, f'2GIS structured data missing on {page_path}'
          listing=c['yandexMapsUrl']
          for local in ('index.html','contacts/index.html'):
              html=(base/'dist'/local).read_text(encoding='utf8')
              assert listing in html, f'Business listing link missing on {local}'

          assert c['phoneE164']=='+79895719977'
          for path in ('index.html','menu/index.html','banquets/index.html','contacts/index.html','privacy/index.html'):
              page=(base/'dist'/path).read_text(encoding='utf8')
              assert '"ymId": "113768615"' in page, f'Metrika ID missing on {path}'
              assert 'mc.yandex.ru/metrika/tag.js' not in page, 'Metrika must not load before consent'
          js=(base/'dist/assets/site.js').read_text(encoding='utf8')
          # Consent behavior, including blocked storage, is verified by browser acceptance.
          assert "tag.js?id=" in js and "Webvisor and e-commerce remain disabled" in js
          h=(base/'dist/menu/index.html').read_text(encoding='utf8')
          assert 'noindex' in h and 'tel:+79895719977' in h
          booking='https://reservation.yandex.ru/partner-reserve/forms/5b1e469e-871a-4eb8-bd2a-787ec2d011c3'
          for path in ('index.html','menu/index.html','banquets/index.html','contacts/index.html','privacy/index.html'):
              page=(base/'dist'/path).read_text(encoding='utf8')
              assert booking in page, f'Missing booking link on {path}'
              assert 'data-track="reserve_click"' in page, f'Missing booking analytics on {path}'
              assert 'noindex' in page, f'Preview unexpectedly indexable: {path}'
          assert 'target="_blank" rel="noopener noreferrer"' in h
          assert 'data-track="reserve_click"' in (base/'dist/index.html').read_text(encoding='utf8')
          home=(base/'dist/index.html').read_text(encoding='utf8')
          assert 'class="mobile-bottom-cta__primary"' in home
          assert re.search(r'class="mobile-bottom-cta__primary"[^>]*data-track="reserve_click"',home), 'Mobile CTA must count in main reservation goal'
          js=(base/'dist/assets/site.js').read_text(encoding='utf8')
          assert "track('phone_click')" in js and "track('menu_open')" in js

          if (base/'content/menu_media.json').exists():
              f=json.loads((base/'content/menu_media.json').read_text(encoding='utf8'))['files']
              assert len(f)==5
              assert [v['group'] for v in f]==['seasonal','main-front','main-back','business','children']
              assert not any('.pdf' in p for x in f for p in x['pages'])
              for x in f:
                  for p in x['pages']:
                      assert (base/'dist'/p.lstrip('/')).is_file()
              assert 'data-menu-index' in h and 'id="menu-lightbox"' in h
          print('PASS: brand, preview-only, real menu media, phone, SEO metadata')
          PY
      - name: Report remaining launch gates without publishing anything
        run: |
          cd site
          python3 scripts/check_launch_readiness.py
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: bravis-static-site
          path: site/dist/
          retention-days: 14
      - name: Verify GitHub Pages preview routing independently
        run: |
          cd site
          python3 scripts/prepare_github_pages.py
          python3 scripts/test_pages_preview.py
