name: BRAVIS remove unused old dish assets
on:
  push:
    paths:
      - '.github/workflows/cleanup-old-dish-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-unused-old-food-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm text menu is restored before deleting unused assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/content/menu.json').read_text(encoding='utf8'))
          assert all(not i.get('image') for s in c['sections'] for i in s.get('items',[]))
          print('OK: Text-only menu')
          PY
      - name: Delete unreferenced historical food photo assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f --ignore-unmatch site/public/uploads/dishes site/reports/old-menu-photo-matches.json site/scripts/import_old_menu_dishes.py
          if ! git diff --cached --quiet; then
            git commit -m 'Remove old food photographs and unused menu import assets'
            git pull --rebase origin main
            git push
          fi
