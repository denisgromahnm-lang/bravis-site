name: BRAVIS menu text extraction for editorial review
on:
  push:
    paths:
      - '.github/workflows/ocr-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Russian OCR language files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Extract draft text only, not visible on website
        run: |
          python3 site/scripts/ocr_menu_review.py
      - name: Save OCR review text to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/content/menu-ocr-review
          if ! git diff --cached --quiet; then
            git commit -m 'Extract raw OCR menu text for verification (not publicly served)'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bravis-menu-ocr-review
          path: site/content/menu-ocr-review
          retention-days: 14
